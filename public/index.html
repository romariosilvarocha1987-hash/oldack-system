<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TESTE 124</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.78)),
                radial-gradient(circle at top, #333, #050505 70%);
            color: white;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            display: none;
            min-height: 100vh;
            padding: 90px 20px 40px;
        }

        .page.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: rgba(20,20,20,.96);
            border: 1px solid #444;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .card h1,
        .card h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input {
            width: 100%;
            padding: 14px;
            margin: 7px 0;
            border: 1px solid #555;
            border-radius: 10px;
            background: #111;
            color: white;
            outline: none;
        }

        .input:focus {
            border-color: white;
        }

        .button-full {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: bold;
        }

        .button-full:hover {
            opacity: .85;
        }

        .secondary {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #555;
            border-radius: 10px;
            background: transparent;
            color: white;
        }

        .secondary:hover {
            background: #222;
        }

        .message {
            min-height: 24px;
            text-align: center;
            margin-top: 12px;
        }

        .menu-button {
            position: fixed;
            z-index: 1000;
            top: 18px;
            left: 18px;
            width: 48px;
            height: 48px;
            border: 1px solid #555;
            border-radius: 12px;
            background: rgba(10,10,10,.92);
            color: white;
            font-size: 24px;
        }

        .side-menu {
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 30%;
            min-width: 270px;
            max-width: 380px;
            height: 100vh;
            padding: 80px 20px 20px;
            background: #101010;
            border-right: 1px solid #444;
            transform: translateX(-110%);
            transition: .25s;
        }

        .side-menu.open {
            transform: translateX(0);
        }

        .close-menu {
            position: absolute;
            top: 18px;
            right: 18px;
            border: 0;
            background: transparent;
            color: white;
            font-size: 25px;
        }

        .menu-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .menu-section {
            color: #aaa;
            font-size: 13px;
            margin: 20px 0 8px;
            text-transform: uppercase;
        }

        .menu-link {
            display: block;
            width: 100%;
            text-align: left;
            padding: 13px;
            margin: 7px 0;
            border: 0;
            border-radius: 10px;
            background: #1d1d1d;
            color: white;
        }

        .menu-link:hover {
            background: #292929;
        }

        .hero {
            text-align: center;
            max-width: 700px;
        }

        .hero h1 {
            font-size: clamp(42px, 10vw, 80px);
            letter-spacing: 3px;
        }

        .hero p {
            margin-top: 15px;
            color: #bbb;
            font-size: 18px;
        }

        .manager-panel {
            width: 100%;
            max-width: 850px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .panel-box {
            padding: 20px;
            background: #171717;
            border: 1px solid #333;
            border-radius: 14px;
        }

        .panel-box h3 {
            margin-bottom: 10px;
        }

        .big-number {
            font-size: 32px;
            font-weight: bold;
        }

        .member-success {
            text-align: center;
        }

        .member-success h1 {
            font-size: 55px;
        }

        .site-version {
            position: fixed;
            right: 12px;
            bottom: 10px;
            color: #888;
            font-size: 12px;
            opacity: .8;
            z-index: 1000;
            pointer-events: none;
        }

        @media (max-width: 700px) {
            .side-menu {
                width: 80%;
                min-width: 0;
            }
        }
    </style>
</head>

<body>

    <!-- BOTÃO DO MENU -->
    <button
        class="menu-button"
        id="menuButton"
        aria-label="Abrir menu">
        ☰
    </button>


    <!-- MENU LATERAL -->
    <nav class="side-menu" id="sideMenu">

        <button
            class="close-menu"
            id="closeMenu"
            aria-label="Fechar menu">
            ×
        </button>

        <div class="menu-title">
            TESTE 124
        </div>

        <div class="menu-section">
            Manager
        </div>

        <button
            class="menu-link"
            onclick="showPage('managerLogin')">
            🔐 Entrar Manager
        </button>

        <div class="menu-section">
            Membro
        </div>

        <button
            class="menu-link"
            onclick="showPage('memberRegister')">
            📝 Cadastrar membro
        </button>

        <button
            class="menu-link"
            onclick="showPage('memberLogin')">
            👤 Entrar membro
        </button>

        <button
            class="menu-link"
            onclick="showPage('home')">
            🏠 Início
        </button>

    </nav>


    <!-- PÁGINA INICIAL -->
    <section class="page active" id="home">

        <div class="hero">

            <h1>TESTE 124</h1>

            <p>
                Bem-vindo ao sistema.
            </p>

        </div>

    </section>


    <!-- CADASTRO DE MEMBRO -->
    <section class="page" id="memberRegister">

        <div class="card">

            <h2>📝 Cadastrar membro</h2>

            <input
                class="input"
                id="registerName"
                type="text"
                placeholder="Nome">

            <input
                class="input"
                id="registerUser"
                type="text"
                placeholder="Login">

            <input
                class="input"
                id="registerPass"
                type="password"
                placeholder="Senha">

            <button
                class="button-full"
                onclick="registerMember()">
                Cadastrar
            </button>

            <button
                class="secondary"
                onclick="showPage('memberLogin')">
                Já tenho uma conta
            </button>

            <div
                class="message"
                id="registerMessage">
            </div>

        </div>

    </section>


    <!-- LOGIN DE MEMBRO -->
    <section class="page" id="memberLogin">

        <div class="card">

            <h2>👤 Entrar como membro</h2>

            <input
                class="input"
                id="memberUser"
                type="text"
                placeholder="Login">

            <input
                class="input"
                id="memberPass"
                type="password"
                placeholder="Senha">

            <button
                class="button-full"
                onclick="loginMember()">
                Entrar
            </button>

            <button
                class="secondary"
                onclick="showPage('memberRegister')">
                Criar conta
            </button>

            <button
                class="secondary"
                onclick="showPage('home')">
                Voltar
            </button>

            <div
                class="message"
                id="memberMessage">
            </div>

        </div>

    </section>


    <!-- PÁGINA APÓS LOGIN DO MEMBRO -->
    <section class="page" id="memberSuccess">

        <div class="card member-success">

            <h1>✅</h1>

            <h2>Teste concluído!</h2>

            <p style="color:#aaa; margin-bottom:15px;">
                Login realizado com sucesso.
            </p>

            <button
                class="button-full"
                onclick="showPage('home')">
                Voltar para o início
            </button>

        </div>

    </section>


    <!-- LOGIN DO MANAGER -->
    <section class="page" id="managerLogin">

        <div class="card">

            <h2>🔐 Entrar Manager</h2>

            <input
                class="input"
                id="managerUser"
                type="text"
                placeholder="Login">

            <input
                class="input"
                id="managerPass"
                type="password"
                placeholder="Senha">

            <button
                class="button-full"
                onclick="loginManager()">
                Entrar
            </button>

            <button
                class="secondary"
                onclick="showPage('home')">
                Voltar
            </button>

            <div
                class="message"
                id="managerMessage">
            </div>

        </div>

    </section>


    <!-- PAINEL DO MANAGER -->
    <section class="page" id="managerPanel">

        <div class="manager-panel">

            <div class="card">

                <h2>⚙️ Painel do Manager</h2>

                <p style="text-align:center;color:#aaa;">
                    Área exclusiva do Manager
                </p>

            </div>


            <div class="panel-grid">

                <div class="panel-box">

                    <h3>👥 Membros</h3>

                    <div
                        class="big-number"
                        id="memberCount">
                        0
                    </div>

                </div>


                <div class="panel-box">

                    <h3>🌐 Site</h3>

                    <p>
                        TESTE 124 online
                    </p>

                </div>


                <div class="panel-box">

                    <h3>📌 Versão</h3>

                    <p>
                        v2.0
                    </p>

                </div>

            </div>


            <div
                class="card"
                style="margin-top:15px;">

                <h3>⚙️ Controles</h3>

                <button
                    class="button-full"
                    onclick="loadMembers()">
                    🔄 Atualizar membros
                </button>

                <button
                    class="secondary"
                    onclick="changeTitle()">
                    📝 Alterar título local
                </button>

                <button
                    class="secondary"
                    onclick="logoutManager()">
                    🚪 Sair do Manager
                </button>

                <div
                    class="message"
                    id="managerPanelMessage">
                </div>

            </div>

        </div>

    </section>


    <!-- VERSÃO DO SITE -->
    <div class="site-version">
        v2.0
    </div>


    <script>

        /* =========================
           NAVEGAÇÃO
        ========================= */

        function showPage(pageId) {

            const pages =
                document.querySelectorAll(".page");

            pages.forEach(page => {
                page.classList.remove("active");
            });

            const selected =
                document.getElementById(pageId);

            if (!selected) {

                console.error(
                    "Página não encontrada:",
                    pageId
                );

                return;
            }

            selected.classList.add("active");

            closeMenu();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        /* =========================
           MENU
        ========================= */

        function openMenu() {

            const menu =
                document.getElementById("sideMenu");

            if (menu) {
                menu.classList.add("open");
            }
        }


        function closeMenu() {

            const menu =
                document.getElementById("sideMenu");

            if (menu) {
                menu.classList.remove("open");
            }
        }


        /* =========================
           CADASTRO DE MEMBRO
        ========================= */

        async function registerMember() {

            const name =
                document
                .getElementById("registerName")
                .value
                .trim();

            const user =
                document
                .getElementById("registerUser")
                .value
                .trim();

            const pass =
                document
                .getElementById("registerPass")
                .value;

            const msg =
                document
                .getElementById("registerMessage");


            if (!name || !user || !pass) {

                msg.textContent =
                    "⚠️ Preencha todos os campos.";

                msg.style.color =
                    "#f87171";

                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/member/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                name,
                                user,
                                pass
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    msg.textContent =
                        data.message ||
                        "❌ Não foi possível cadastrar.";

                    msg.style.color =
                        "#f87171";

                    return;
                }


                msg.textContent =
                    "✅ Cadastro realizado!";

                msg.style.color =
                    "#4ade80";


                document
                    .getElementById("registerName")
                    .value = "";

                document
                    .getElementById("registerUser")
                    .value = "";

                document
                    .getElementById("registerPass")
                    .value = "";


                setTimeout(() => {

                    showPage("memberLogin");

                }, 1000);


            } catch (error) {

                console.error(error);

                msg.textContent =
                    "❌ Erro ao conectar ao servidor.";

                msg.style.color =
                    "#f87171";
            }
        }


        /* =========================
           LOGIN DE MEMBRO
        ========================= */

        async function loginMember() {

            const user =
                document
                .getElementById("memberUser")
                .value
                .trim();

            const pass =
                document
                .getElementById("memberPass")
                .value;

            const msg =
                document
                .getElementById("memberMessage");


            if (!user || !pass) {

                msg.textContent =
                    "⚠️ Preencha login e senha.";

                msg.style.color =
                    "#f87171";

                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/member/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                user,
                                pass
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    msg.textContent =
                        data.message ||
                        "❌ Usuário ou senha incorretos.";

                    msg.style.color =
                        "#f87171";

                    return;
                }


                msg.textContent =
                    "✅ Login realizado!";

                msg.style.color =
                    "#4ade80";


                setTimeout(() => {

                    showPage("memberSuccess");

                }, 500);


            } catch (error) {

                console.error(error);

                msg.textContent =
                    "❌ Erro ao conectar ao servidor.";

                msg.style.color =
                    "#f87171";
            }
        }
