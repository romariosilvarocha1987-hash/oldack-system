<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TESTE 123</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.75)),
        radial-gradient(circle at top, #333, #050505 70%);
    color: white;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.page {
    display: none;
    min-height: 100vh;
    padding: 90px 20px 40px;
}

.page.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 430px;
    background: rgba(20,20,20,.95);
    border: 1px solid #444;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.card h1,
.card h2 {
    text-align: center;
    margin-bottom: 20px;
}

.input {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #555;
    border-radius: 10px;
    background: #111;
    color: white;
    outline: none;
}

.input:focus {
    border-color: white;
}

.button-full {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: white;
    color: black;
    font-weight: bold;
}

.button-full:hover {
    opacity: .85;
}

.secondary {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: 1px solid #555;
    border-radius: 10px;
    background: transparent;
    color: white;
}

.message {
    min-height: 24px;
    text-align: center;
    margin-top: 12px;
}

.menu-button {
    position: fixed;
    z-index: 1000;
    top: 18px;
    left: 18px;
    width: 48px;
    height: 48px;
    border: 1px solid #555;
    border-radius: 12px;
    background: rgba(10,10,10,.9);
    color: white;
    font-size: 24px;
}

.side-menu {
    position: fixed;
    z-index: 999;
    top: 0;
    left: 0;
    width: 30%;
    min-width: 270px;
    max-width: 380px;
    height: 100vh;
    padding: 80px 20px 20px;
    background: #101010;
    border-right: 1px solid #444;
    transform: translateX(-110%);
    transition: .25s;
}

.side-menu.open {
    transform: translateX(0);
}

.close-menu {
    position: absolute;
    top: 18px;
    right: 18px;
    border: 0;
    background: transparent;
    color: white;
    font-size: 25px;
}

.menu-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 25px;
}

.menu-section {
    color: #aaa;
    font-size: 13px;
    margin: 20px 0 8px;
    text-transform: uppercase;
}

.menu-link {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px;
    margin: 7px 0;
    border: 0;
    border-radius: 10px;
    background: #1d1d1d;
    color: white;
}

.menu-link:hover {
    background: #292929;
}

.hero {
    text-align: center;
    max-width: 700px;
}

.hero h1 {
    font-size: clamp(42px, 10vw, 80px);
    letter-spacing: 3px;
}

.hero p {
    margin-top: 15px;
    color: #bbb;
    font-size: 18px;
}

.manager-panel {
    width: 100%;
    max-width: 850px;
}

.panel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.panel-box {
    padding: 20px;
    background: #171717;
    border: 1px solid #333;
    border-radius: 14px;
}

.panel-box h3 {
    margin-bottom: 10px;
}

.big-number {
    font-size: 32px;
    font-weight: bold;
}

.member-success {
    text-align: center;
}

.member-success h1 {
    font-size: 45px;
}

@media (max-width: 700px) {
    .side-menu {
        width: 80%;
        min-width: 0;
    }
}
</style>
</head>

<body>

<!-- BOTÃO DO MENU -->
<button
    class="menu-button"
    id="menuButton"
    aria-label="Abrir menu">
    ☰
</button>

<!-- MENU LATERAL -->
<nav class="side-menu" id="sideMenu">

    <button
        class="close-menu"
        id="closeMenu">
        ×
    </button>

    <div class="menu-title">
        TESTE 123
    </div>

    <div class="menu-section">
        Manager
    </div>

    <button
        class="menu-link"
        onclick="showPage('managerLogin')">
        🔐 Entrar Manager
    </button>

    <div class="menu-section">
        Membro
    </div>

    <button
        class="menu-link"
        onclick="showPage('memberRegister')">
        📝 Cadastrar membro
    </button>

    <button
        class="menu-link"
        onclick="showPage('memberLogin')">
        👤 Entrar membro
    </button>

</nav>


<!-- ========================= -->
<!-- PÁGINA PRINCIPAL -->
<!-- ========================= -->

<section class="page active" id="home">

    <div class="hero">

        <h1>TESTE 123</h1>

        <p>
            Bem-vindo ao sistema.
        </p>

    </div>

</section>


<!-- ========================= -->
<!-- CADASTRO MEMBRO -->
<!-- ========================= -->

<section class="page" id="memberRegister">

    <div class="card">

        <h2>📝 Cadastrar membro</h2>

        <input
            class="input"
            id="registerName"
            placeholder="Nome">

        <input
            class="input"
            id="registerUser"
            placeholder="Login">

        <input
            class="input"
            id="registerPass"
            type="password"
            placeholder="Senha">

        <button
            class="button-full"
            onclick="registerMember()">
            Cadastrar
        </button>

        <button
            class="secondary"
            onclick="showPage('memberLogin')">
            Já tenho uma conta
        </button>

        <div
            class="message"
            id="registerMessage">
        </div>

    </div>

</section>


<!-- ========================= -->
<!-- LOGIN MEMBRO -->
<!-- ========================= -->

<section class="page" id="memberLogin">

    <div class="card">

        <h2>👤 Entrar como membro</h2>

        <input
            class="input"
            id="memberUser"
            placeholder="Login">

        <input
            class="input"
            id="memberPass"
            type="password"
            placeholder="Senha">

        <button
            class="button-full"
            onclick="loginMember()">
            Entrar
        </button>

        <button
            class="secondary"
            onclick="showPage('memberRegister')">
            Criar conta
        </button>

        <div
            class="message"
            id="memberMessage">
        </div>

    </div>

</section>


<!-- ========================= -->
<!-- SUCESSO MEMBRO -->
<!-- ========================= -->

<section class="page" id="memberSuccess">

    <div class="card member-success">

        <h1>✅</h1>

        <h2>membro entrou!</h2>

        <button
            class="button-full"
            onclick="showPage('home')">
            Voltar
        </button>

    </div>

</section>


<!-- ========================= -->
<!-- LOGIN MANAGER -->
<!-- ========================= -->

<section class="page" id="managerLogin">

    <div class="card">

        <h2>🔐 Entrar Manager</h2>

        <input
            class="input"
            id="managerUser"
            placeholder="Login">

        <input
            class="input"
            id="managerPass"
            type="password"
            placeholder="Senha">

        <button
            class="button-full"
            onclick="loginManager()">
            Entrar
        </button>

        <button
            class="secondary"
            onclick="showPage('home')">
            Voltar
        </button>

        <div
            class="message"
            id="managerMessage">
        </div>

    </div>

</section>


<!-- ========================= -->
<!-- PAINEL MANAGER -->
<!-- ========================= -->

<section class="page" id="managerPanel">

    <div class="manager-panel">

        <div class="card">

            <h2>⚙️ Painel do Manager</h2>

            <p style="text-align:center;color:#aaa">
                Controle do sistema
            </p>

        </div>

        <div class="panel-grid">

            <div class="panel-box">

                <h3>👥 Membros</h3>

                <div
                    class="big-number"
                    id="memberCount">
                    0
                </div>

            </div>

            <div class="panel-box">

                <h3>🌐 Site</h3>

                <p>
                    Sistema online
                </p>

            </div>

        </div>

        <div class="card" style="margin-top:15px">

            <h3>Alterar título local</h3>

            <input
                class="input"
                id="newTitle"
                placeholder="Novo título">

            <button
                class="button-full"
                onclick="changeTitle()">
                Alterar título
            </button>

            <button
                class="secondary"
                onclick="loadMembers()">
                Atualizar membros
            </button>

            <button
                class="secondary"
                onclick="logoutManager()">
                Sair do Manager
            </button>

            <div
                class="message"
                id="managerPanelMessage">
            </div>

        </div>

    </div>

</section>


<script>

/* =========================
   NAVEGAÇÃO
========================= */

function showPage(pageId) {

    const pages =
        document.querySelectorAll(".page");

    pages.forEach(page => {
        page.classList.remove("active");
    });

    const page =
        document.getElementById(pageId);

    if (!page) {
        console.error(
            "Página não encontrada:",
            pageId
        );
        return;
    }

    page.classList.add("active");

    closeMenu();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================
   MENU
========================= */

function openMenu() {

    const menu =
        document.getElementById("sideMenu");

    if (menu) {
        menu.classList.add("open");
    }
}


function closeMenu() {

    const menu =
        document.getElementById("sideMenu");

    if (menu) {
        menu.classList.remove("open");
    }
}


/* =========================
   CADASTRO MEMBRO
========================= */

async function registerMember() {

    const name =
        document
        .getElementById("registerName")
        .value
        .trim();

    const user =
        document
        .getElementById("registerUser")
        .value
        .trim();

    const pass =
        document
        .getElementById("registerPass")
        .value;

    const msg =
        document
        .getElementById("registerMessage");

    if (!name || !user || !pass) {

        msg.textContent =
            "⚠️ Preencha todos os campos.";

        msg.style.color = "#f87171";

        return;
    }

    try {

        const response =
            await fetch(
                "/api/member/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        user,
                        pass
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            msg.textContent =
                data.message ||
                "❌ Não foi possível cadastrar.";

            msg.style.color =
                "#f87171";

            return;
        }

        msg.textContent =
            "✅ Cadastro realizado!";

        msg.style.color =
            "#4ade80";

        document
            .getElementById("registerPass")
            .value = "";

        setTimeout(() => {
            showPage("memberLogin");
        }, 1000);

    } catch (error) {

        console.error(error);

        msg.textContent =
            "❌ Não foi possível conectar ao servidor.";

        msg.style.color =
            "#f87171";
    }
}


/* =========================
   LOGIN MEMBRO
========================= */

async function loginMember() {

    const user =
        document
        .getElementById("memberUser")
        .value
        .trim();

    const pass =
        document
        .getElementById("memberPass")
        .value;

    const msg =
        document
        .getElementById("memberMessage");

    if (!user || !pass) {

        msg.textContent =
            "⚠️ Preencha login e senha.";

        msg.style.color =
            "#f87171";

        return;
    }

    try {

        const response =
            await fetch(
                "/api/member/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        user,
                        pass
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            msg.textContent =
                data.message ||
                "❌ Login inválido.";

            msg.style.color =
                "#f87171";

            return;
        }

        msg.textContent =
            "✅ Entrando...";

        msg.style.color =
            "#4ade80";

        setTimeout(() => {
            showPage("memberSuccess");
        }, 500);

    } catch (error) {

        console.error(error);

        msg.textContent =
            "❌ Erro ao conectar ao servidor.";

        msg.style.color =
            "#f87171";
    }
}


/* =========================
   LOGIN MANAGER
========================= */

async function loginManager() {

    const user =
        document
        .getElementById("managerUser")
        .value
        .trim();

    const pass =
        document
        .getElementById("managerPass")
        .value;

    const msg =
        document
        .getElementById("managerMessage");

    if (!user || !pass) {

        msg.textContent =
            "⚠️ Preencha login e senha.";

        msg.style.color =
            "#f87171";

        return;
    }

    try {

        const response =
            await fetch(
                "/api/manager/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        user,
                        pass
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            msg.textContent =
                data.message ||
                "❌ Dados incorretos.";

            msg.style.color =
                "#f87171";

            return;
        }

        msg.textContent =
            "✅ Entrando...";

        msg.style.color =
            "#4ade80";

        setTimeout(() => {

            showPage("managerPanel");

            loadMembers();

        }, 500);

    } catch (error) {

        console.error(error);

        msg.textContent =
            "❌ Erro ao conectar ao servidor.";

        msg.style.color =
            "#f87171";
    }
}


/* =========================
   CARREGAR MEMBROS
========================= */

async function loadMembers() {

    try {

        const response =
            await fetch(
                "/api/manager/members",
                {
                    credentials: "include"
                }
            );

        if (!response.ok) {

            document
                .getElementById("memberCount")
                .textContent = "?";

            return;
        }

        const data =
            await response.json();

        const count =
            Array.isArray(data)
                ? data.length
                : (data.members || []).length;

        document
            .getElementById("memberCount")
            .textContent =
                count;

    } catch (error) {

        console.error(error);

        document
            .getElementById("memberCount")
            .textContent = "?";
    }
}


/* =========================
   ALTERAR TÍTULO
========================= */

function changeTitle() {

    const input =
        document
        .getElementById("newTitle");

    const title =
        input.value.trim();

    const msg =
        document
        .getElementById("managerPanelMessage");

    if (!title) {

        msg.textContent =
            "⚠️ Digite um título.";

        return;
    }

    document.title = title;

    msg.textContent =
        "✅ Título alterado nesta sessão.";

    msg.style.color =
        "#4ade80";
}


/* =========================
   LOGOUT
========================= */

async function logoutManager() {

    try {

        await fetch(
            "/api/manager/logout",
            {
                method: "POST",
                credentials: "include"
            }
        );

    } catch (error) {

        console.error(error);

    }

    showPage("home");

}


/* =========================
   INICIALIZAÇÃO
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const menuButton =
            document.getElementById(
                "menuButton"
            );

        const closeButton =
            document.getElementById(
                "closeMenu"
            );

        if (menuButton) {

            menuButton.addEventListener(
                "click",
                openMenu
            );
        }

        if (closeButton) {

            closeButton.addEventListener(
                "click",
                closeMenu
            );
        }

        console.log(
            "TESTE 123: JavaScript carregado."
        );

    }
);

</script>

</body>
</html>
