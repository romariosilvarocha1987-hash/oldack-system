<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>perfumes❤️Tâmara</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #fff;
            color: #222;
            min-height: 100vh;
        }


        button,
        input {
            font-family: inherit;
        }


        .hidden {
            display: none !important;
        }


        /* =========================
           TELA DE CADASTRO
        ========================= */

        .auth-page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #ffe6f0
                );

        }


        .auth-box {

            width: 100%;

            max-width: 400px;

            background: white;

            padding: 30px 25px;

            border-radius: 22px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.10);

        }


        .logo {

            text-align: center;

            color: #e91e63;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

        }


        .auth-box input {

            width: 100%;

            padding: 14px;

            margin-bottom: 12px;

            border: 1px solid #ddd;

            border-radius: 12px;

            outline: none;

            font-size: 15px;

        }


        .auth-box input:focus {

            border-color: #e91e63;

        }


        .main-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: #e91e63;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .main-button:active {

            transform: scale(0.98);

        }


        .secondary-button {

            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: 1px solid #e91e63;

            border-radius: 12px;

            background: white;

            color: #e91e63;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        .message {

            text-align: center;

            margin-top: 12px;

            font-size: 14px;

        }


        /* =========================
           SITE PRINCIPAL
        ========================= */

        #sitePage {

            min-height: 100vh;

            padding-bottom: 80px;

        }


        header {

            background: #e91e63;

            color: white;

            padding: 18px;

            text-align: center;

            position: sticky;

            top: 0;

            z-index: 10;

        }


        header h1 {

            font-size: 24px;

        }


        .content {

            padding: 18px;

            max-width: 1100px;

            margin: auto;

        }


        .welcome {

            margin-bottom: 20px;

        }


        .welcome h2 {

            font-size: 23px;

            margin-bottom: 5px;

        }


        .welcome p {

            color: #777;

        }


        /* =========================
           PRODUTOS
        ========================= */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;

        }


        .product-card {

            background: white;

            border-radius: 16px;

            overflow: hidden;

            border: 1px solid #eee;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.07);

        }


        .product-image {

            width: 100%;

            aspect-ratio: 1 / 1;

            background: #f7f7f7;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

        }


        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .no-image {

            font-size: 42px;

        }


        .product-info {

            padding: 12px;

        }


        .product-info h3 {

            font-size: 16px;

            margin-bottom: 7px;

        }


        .product-info p {

            color: #777;

            font-size: 13px;

            margin-bottom: 8px;

        }


        .price {

            color: #e91e63;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .product-button {

            width: 100%;

            padding: 10px;

            border: none;

            border-radius: 10px;

            background: #e91e63;

            color: white;

            cursor: pointer;

            font-weight: bold;

        }


        /* =========================
           BUSCA
        ========================= */

        .search-box {

            margin-bottom: 20px;

        }


        .search-box input {

            width: 100%;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 14px;

            font-size: 16px;

            outline: none;

        }


        .search-box input:focus {

            border-color: #e91e63;

        }


        .no-results {

            text-align: center;

            color: #777;

            padding: 30px 10px;

        }


        /* =========================
           PERFIL
        ========================= */

        .profile-box {

            max-width: 500px;

            margin: auto;

            background: white;

            border: 1px solid #eee;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.07);

            text-align: center;

        }


        .profile-photo {

            width: 110px;

            height: 110px;

            border-radius: 50%;

            margin: 0 auto 15px;

            background: #ffe6f0;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            border: 3px solid #e91e63;

        }


        .profile-photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .profile-default {

            font-size: 45px;

        }


        .profile-info {

            text-align: left;

            margin-top: 20px;

        }


        .profile-item {

            padding: 14px;

            border-bottom: 1px solid #eee;

        }


        .profile-item:last-child {

            border-bottom: none;

        }


        .profile-label {

            font-size: 12px;

            color: #999;

            margin-bottom: 4px;

        }


        .profile-value {

            font-size: 16px;

            font-weight: bold;

        }


        .logout-button {

            width: 100%;

            margin-top: 20px;

            padding: 13px;

            border: none;

            border-radius: 12px;

            background: #222;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        /* =========================
           BARRA INFERIOR
        ========================= */

        .bottom-nav {

            position: fixed;

            bottom: 0;

            left: 0;

            width: 100%;

            height: 68px;

            background: white;

            border-top: 1px solid #eee;

            display: flex;

            justify-content: space-around;

            align-items: center;

            z-index: 100;

            box-shadow:
                0 -3px 15px
                rgba(0, 0, 0, 0.06);

        }


        .nav-button {

            background: none;

            border: none;

            color: #888;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            cursor: pointer;

            font-size: 12px;

            min-width: 70px;

        }


        .nav-icon {

            font-size: 23px;

        }


        .nav-button.active {

            color: #e91e63;

            font-weight: bold;

        }


        /* =========================
           VERSÃO
        ========================= */

        .version {

            position: fixed;

            right: 8px;

            bottom: 72px;

            color: #aaa;

            font-size: 10px;

            z-index: 20;

        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .products-grid {

                grid-template-columns:
                    repeat(4, 1fr);

            }


            .content {

                padding: 30px;

            }


            header h1 {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         CADASTRO
    ========================= -->

    <section
        id="registerPage"
        class="auth-page"
    >

        <div class="auth-box">

            <div class="logo">
                perfumes❤️Tâmara
            </div>


            <div class="subtitle">
                Criar uma nova conta
            </div>


            <form id="registerForm">


                <!-- NOME DA PESSOA -->

                <input
                    type="text"
                    id="registerName"
                    placeholder="Nome"
                    required
                >


                <!-- ID ÚNICO DA CONTA -->

                <input
                    type="text"
                    id="registerUser"
                    placeholder="ID de usuário"
                    required
                >


                <!-- SENHA -->

                <input
                    type="password"
                    id="registerPass"
                    placeholder="Senha"
                    required
                >


                <button
                    class="main-button"
                    type="submit"
                >
                    Criar conta
                </button>


            </form>


            <button
                class="secondary-button"
                onclick="showLogin()"
            >
                Entrar na conta
            </button>


            <div
                id="registerMessage"
                class="message"
            ></div>

        </div>

    </section>


    <!-- =========================
         LOGIN
    ========================= -->

    <section
        id="loginPage"
        class="auth-page hidden"
    >

        <div class="auth-box">

            <div class="logo">
                perfumes❤️Tâmara
            </div>


            <div class="subtitle">
                Entrar na sua conta
            </div>


            <form id="loginForm">


                <!-- AQUI É O ID DE USUÁRIO -->

                <input
                    type="text"
                    id="loginUser"
                    placeholder="ID de usuário"
                    required
                >


                <input
                    type="password"
                    id="loginPass"
                    placeholder="Senha"
                    required
                >


                <button
                    class="main-button"
                    type="submit"
                >
                    Entrar
                </button>


            </form>


            <button
                class="secondary-button"
                onclick="showRegister()"
            >
                Criar uma conta
            </button>


            <div
                id="loginMessage"
                class="message"
            ></div>

        </div>

    </section>


    <!-- =========================
         SITE
    ========================= -->

    <section
        id="sitePage"
        class="hidden"
    >


        <header>

            <h1>
                perfumes❤️Tâmara
            </h1>

        </header>


        <!-- =========================
             INÍCIO
        ========================= -->

        <main
            id="homePage"
            class="content"
        >

            <div class="welcome">

                <h2>
                    Olá,
                    <span id="homeUserName">
                        usuário
                    </span>
                    ! ❤️
                </h2>

                <p>
                    Confira nossos produtos.
                </p>

            </div>


            <div
                id="homeProducts"
                class="products-grid"
            ></div>

        </main>


        <!-- =========================
             BUSCA
        ========================= -->

        <main
            id="searchPage"
            class="content hidden"
        >

            <div class="welcome">

                <h2>
                    Buscar produtos 🔎
                </h2>

                <p>
                    Digite o nome do produto
                    para pesquisar.
                </p>

            </div>


            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Pesquisar produto..."
                    oninput="renderSearch()"
                >

            </div>


            <!--
                IMPORTANTE:
                ESTE ESPAÇO COMEÇA VAZIO.
                OS PRODUTOS SÓ APARECEM
                DEPOIS QUE A PESSOA PESQUISAR.
            -->

            <div
                id="searchProducts"
                class="products-grid"
            ></div>

        </main>


        <!-- =========================
             PERFIL
        ========================= -->

        <main
            id="profilePage"
            class="content hidden"
        >

            <div class="welcome">

                <h2>
                    Meu perfil 👤
                </h2>

            </div>


            <div class="profile-box">


                <div
                    class="profile-photo"
                    id="profilePhoto"
                >

                    <span class="profile-default">
                        👤
                    </span>

                </div>


                <input
                    type="file"
                    id="photoInput"
                    accept="image/*"
                    class="hidden"
                >


                <button
                    class="secondary-button"
                    onclick="choosePhoto()"
                >
                    📷 Escolher foto do dispositivo
                </button>


                <div class="profile-info">


                    <!-- NOME -->

                    <div class="profile-item">

                        <div class="profile-label">
                            Nome
                        </div>

                        <div
                            class="profile-value"
                            id="profileName"
                        >
                            —
                        </div>

                    </div>


                    <!-- ID DE USUÁRIO -->

                    <div class="profile-item">

                        <div class="profile-label">
                            ID de usuário
                        </div>

                        <div
                            class="profile-value"
                            id="profileUser"
                        >
                            —
                        </div>

                    </div>


                    <!-- SENHA -->

                    <div class="profile-item">

                        <div class="profile-label">
                            Senha
                        </div>

                        <div class="profile-value">
                            ••••••••
                        </div>

                    </div>


                </div>


                <button
                    class="logout-button"
                    onclick="logout()"
                >
                    Sair da conta
                </button>


            </div>

        </main>


        <!-- =========================
             BARRA INFERIOR
        ========================= -->

        <nav class="bottom-nav">


            <button
                id="navHome"
                class="nav-button active"
                onclick="showPage('home')"
            >

                <span class="nav-icon">
                    🏠
                </span>

                <span>
                    Início
                </span>

            </button>


            <button
                id="navSearch"
                class="nav-button"
                onclick="showPage('search')"
            >

                <span class="nav-icon">
                    🔎
                </span>

                <span>
                    Busca
                </span>

            </button>


            <button
                id="navProfile"
                class="nav-button"
                onclick="showPage('profile')"
            >

                <span class="nav-icon">
                    👤
                </span>

                <span>
                    Perfil
                </span>

            </button>


        </nav>


        <div class="version">
            v4.5
        </div>


    </section>


    <script>


        /* =========================
           USUÁRIO ATUAL
        ========================= */

        let currentUser = {

            name: "",

            user: ""

        };


        /* =========================
           PRODUTOS
        ========================= */

        const products = [

            {

                name:
                    "perfume uomini 200ml",

                description:
                    "Perfume masculino 200ml.",

                price:
                    "R$ 00,00",

                image:
                    ""

            }

        ];


        /* =========================
           ELEMENTOS
        ========================= */

        const registerPage =
            document.getElementById(
                "registerPage"
            );

        const loginPage =
            document.getElementById(
                "loginPage"
            );

        const sitePage =
            document.getElementById(
                "sitePage"
            );


        /* =========================
           TROCAR PARA LOGIN
        ========================= */

        function showLogin() {

            registerPage
                .classList
                .add("hidden");

            loginPage
                .classList
                .remove("hidden");

        }


        /* =========================
           TROCAR PARA CADASTRO
        ========================= */

        function showRegister() {

            loginPage
                .classList
                .add("hidden");

            registerPage
                .classList
                .remove("hidden");

        }


               /* =========================
           ENTRAR NO SITE
        ========================= */

        function enterSite(
            name,
            user
        ) {

            /*
                name = NOME DA PESSOA
                user = ID DE USUÁRIO
            */

            currentUser.name =
                name || "";

            currentUser.user =
                user || "";


            registerPage
                .classList
                .add("hidden");

            loginPage
                .classList
                .add("hidden");

            sitePage
                .classList
                .remove("hidden");


            updateProfile();

            renderHome();

            renderSearch();

            showPage("home");

        }


        /* =========================
           ATUALIZAR PERFIL
        ========================= */

        function updateProfile() {

            document
                .getElementById("homeUserName")
                .textContent =
                    currentUser.name ||
                    "usuário";


            document
                .getElementById("profileName")
                .textContent =
                    currentUser.name ||
                    "—";


            document
                .getElementById("profileUser")
                .textContent =
                    currentUser.user ||
                    "—";

        }


        /* =========================
           NAVEGAÇÃO
        ========================= */

        function showPage(page) {

            const homePage =
                document.getElementById("homePage");

            const searchPage =
                document.getElementById("searchPage");

            const profilePage =
                document.getElementById("profilePage");


            homePage
                .classList
                .add("hidden");

            searchPage
                .classList
                .add("hidden");

            profilePage
                .classList
                .add("hidden");


            document
                .getElementById("navHome")
                .classList
                .remove("active");

            document
                .getElementById("navSearch")
                .classList
                .remove("active");

            document
                .getElementById("navProfile")
                .classList
                .remove("active");


            if (page === "home") {

                homePage
                    .classList
                    .remove("hidden");

                document
                    .getElementById("navHome")
                    .classList
                    .add("active");

                renderHome();

            }


            if (page === "search") {

                searchPage
                    .classList
                    .remove("hidden");

                document
                    .getElementById("navSearch")
                    .classList
                    .add("active");

                renderSearch();

            }


            if (page === "profile") {

                profilePage
                    .classList
                    .remove("hidden");

                document
                    .getElementById("navProfile")
                    .classList
                    .add("active");

                updateProfile();

            }

        }


        /* =========================
           CRIAR CARD
        ========================= */

        function createProductCard(product) {

            const card =
                document.createElement("div");

            card.className =
                "product-card";


            let imageHTML = "";


            if (product.image) {

                imageHTML = `
                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >
                `;

            } else {

                imageHTML = `
                    <span class="no-image">
                        🧴
                    </span>
                `;

            }


            card.innerHTML = `

                <div class="product-image">
                    ${imageHTML}
                </div>

                <div class="product-info">

                    <h3>
                        ${product.name}
                    </h3>

                    <p>
                        ${product.description}
                    </p>

                    <div class="price">
                        ${product.price}
                    </div>

                    <button
                        class="product-button"
                        onclick="selectProduct('${escapeQuotes(product.name)}')"
                    >
                        Ver produto
                    </button>

                </div>

            `;


            return card;

        }


        /* =========================
           HOME
        ========================= */

        function renderHome() {

            const container =
                document.getElementById(
                    "homeProducts"
                );

            container.innerHTML = "";


            if (products.length === 0) {

                container.innerHTML = `

                    <div class="no-results">
                        Nenhum produto disponível.
                    </div>

                `;

                return;

            }


            products.forEach(
                function(product) {

                    container.appendChild(
                        createProductCard(product)
                    );

                }
            );

        }


        /* =========================
           BUSCA
        ========================= */

        function renderSearch() {

            const container =
                document.getElementById(
                    "searchProducts"
                );

            const input =
                document.getElementById(
                    "searchInput"
                );


            const search =
                input.value
                    .trim()
                    .toLowerCase();


            container.innerHTML = "";


            /*
                NÃO MOSTRAR PRODUTOS
                ANTES DA PESQUISA.
            */

            if (search === "") {

                return;

            }


            const results =
                products.filter(
                    function(product) {

                        const name =
                            product.name
                                .toLowerCase();

                        const description =
                            product.description
                                .toLowerCase();


                        return (
                            name.includes(search) ||
                            description.includes(search)
                        );

                    }
                );


            if (results.length === 0) {

                container.innerHTML = `

                    <div class="no-results">
                        Nenhum produto encontrado.
                    </div>

                `;

                return;

            }


            results.forEach(
                function(product) {

                    container.appendChild(
                        createProductCard(product)
                    );

                }
            );

        }        function selectProduct(name) {

            alert(
                "Você selecionou: " +
                name +
                " ❤️"
            );

        }


        function escapeQuotes(text) {

            return String(text)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }


        function choosePhoto() {

            document
                .getElementById("photoInput")
                .click();

        }


        document
            .getElementById("photoInput")
            .addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];

                    if (!file) {
                        return;
                    }

                    const reader =
                        new FileReader();

                    reader.onload =
                        function (event) {

                            document
                                .getElementById(
                                    "profilePhoto"
                                )
                                .src =
                                    event.target.result;

                        };

                    reader.readAsDataURL(file);

                }
            );


        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const name =
                        document
                            .getElementById(
                                "registerName"
                            )
                            .value
                            .trim();

                    const user =
                        document
                            .getElementById(
                                "registerUser"
                            )
                            .value
                            .trim()
                            .toLowerCase();

                    const pass =
                        document
                            .getElementById(
                                "registerPass"
                            )
                            .value;


                    if (
                        !name ||
                        !user ||
                        !pass
                    ) {

                        alert(
                            "Preencha todos os campos."
                        );

                        return;

                    }


                    try {

                        const response =
                            await fetch(
                                "/api/member/register",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        name: name,
                                        user: user,
                                        pass: pass
                                    })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            alert(
                                data.error ||
                                data.message ||
                                "Não foi possível criar a conta."
                            );

                            return;

                        }


                        /*
                            Depois de criar a conta,
                            entra automaticamente.

                            O NOME continua sendo o nome
                            da pessoa.

                            O USER continua sendo apenas
                            o ID da conta.
                        */

                        const loginResponse =
                            await fetch(
                                "/api/member/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        user: user,
                                        pass: pass
                                    })
                                }
                            );


                        const loginData =
                            await loginResponse.json();


                        if (!loginResponse.ok) {

                            alert(
                                loginData.error ||
                                loginData.message ||
                                "Conta criada, mas não foi possível entrar."
                            );

                            return;

                        }


                        enterSite(
                            loginData.name || name,
                            user
                        );

                    }

                    catch (error) {

                        console.error(error);

                        alert(
                            "Erro de conexão com o servidor."
                        );

                    }

                }
            );


        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const user =
                        document
                            .getElementById(
                                "loginUser"
                            )
                            .value
                            .trim()
                            .toLowerCase();

                    const pass =
                        document
                            .getElementById(
                                "loginPass"
                            )
                            .value;


                    if (
                        !user ||
                        !pass
                    ) {

                        alert(
                            "Digite seu ID de usuário e senha."
                        );

                        return;

                    }


                    try {

                        const response =
                            await fetch(
                                "/api/member/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        user: user,
                                        pass: pass
                                    })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            alert(
                                data.error ||
                                data.message ||
                                "ID ou senha incorretos."
                            );

                            return;

                        }


                        /*
                            IMPORTANTE:

                            data.name = nome da pessoa
                            user      = ID da conta

                            O ID NÃO será usado como nome.
                        */

                        enterSite(
                            data.name || "Usuário",
                            user
                        );

                    }

                    catch (error) {

                        console.error(error);

                        alert(
                            "Erro de conexão com o servidor."
                        );

                    }

                }
            );


        async function logout() {

            try {

                await fetch(
                    "/api/member/logout",
                    {
                        method: "POST"
                    }
                );

            }

            catch (error) {

                console.error(error);

            }


            currentUser.name = "";
            currentUser.user = "";


            sitePage
                .classList
                .add("hidden");

            loginPage
                .classList
                .remove("hidden");


            document
                .getElementById("loginForm")
                .reset();

        }


        /*
            Inicialização
        */

        renderHome();

        renderSearch();

    </script>

</body>

</html>
